

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .gender input,
        .hobbies input {
            width: auto;
        }

        .buttons {
            margin-top: 20px;
        }

        .buttons input {
            width: auto;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>login</h1>

    <form>

        <!-- Text -->
        <label>Full Name:</label>
        <input type="text" name="fullname" placeholder="Enter your full name">

        <!-- Email -->
        <label>Email:</label>
        <input type="email" name="email" placeholder="Enter your email">

        <!-- Password -->
        <label>Password:</label>
        <input type="password" name="password" placeholder="Enter password">

        <!-- Telephone -->
        <label>Phone Number:</label>
        <input type="tel" name="phone" placeholder="Enter phone number">

        <!-- Number -->
        <label>Age:</label>
        <input type="number" name="age" plsceholder = "Enter your age">

        <!-- Date -->
        <label>Date of Birth:</label>
        <input type="date" name="dob"


        <!-- URL -->
        <label>Website:</label>
        <input type="url" name="website" placeholder="https://example.com">

        <!-- Search -->
        <label>Search:</label>
        <input type="search" name="search" placeholder="Search something">

        <!-- Range -->
        <label>Skill Level:</label>
        <input type="range" name="skill">

        <!-- Radio -->
        <label>Gender:</label>
        <div class="gender">
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
            <input type="radio" name="gender" value="other"> Other
        </div>

        <!-- Checkbox -->
        <label>Hobbies:</label>
        <div class="hobbies">
            <input type="checkbox" name="hobby" value="coding"> Coding
            <input type="checkbox" name="hobby" value="gaming"> Gaming
            <input type="checkbox" name="hobby" value="music"> Music
            <input type="checkbox" name="hobby" value="sports"> Sports
        </div>

        <!-- File -->
        <label>Profile Picture:</label>
        <input type="file" name="profile">

        <!-- Hidden -->
        <input type="hidden" name="user_type" value="new_user">

        <!-- Submit -->
        <div class="buttons">
            <input type="submit" value="Create Account">

            <!-- Reset -->
            <input type="reset" value="Reset">
        </div>

    </form>

</div>

</body>
</html>
